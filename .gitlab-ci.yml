stages:
  - test

default:
  tags:
    - k8s
    - amd64
  before_script:
    - . test/docker_test/tree-tested-skip.sh

variables:
  REPO_NAME: module-sqlite3

# A develop commit whose tree already passed CI (a merged pull request that was up to date with develop) is not tested
# again: tree-already-tested.sh finds the pipeline that passed the tree, and every job sources tree-tested-skip.sh
# first, which then ends the job with success.  Without such a pipeline, or when the pipelines cannot be read, the
# whole pipeline runs.  The same job runs in qore's pipelines.
tree-already-tested:
  stage: .pre
  needs:
    - job: github-pending
      artifacts: false
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  services: []
  before_script: []
  variables:
    GIT_DEPTH: "3"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  script:
    - python3 -B -W error test/docker_test/test_squash_head.py
    - sh test/docker_test/tree-already-tested.sh
  artifacts:
    reports:
      dotenv: tree-tested.env

test-ubuntu:
  stage: test
  needs:
    - job: github-pending
      artifacts: false
    - job: tree-already-tested
      optional: true
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  script:
    - test/docker_test/test-ubuntu.sh

test-alpine:
  stage: test
  needs:
    - job: github-pending
      artifacts: false
    - job: tree-already-tested
      optional: true
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop-alpine
  script:
    - test/docker_test/test-alpine.sh

# The required check represents this pipeline, including any platform jobs that reused a tested tree.
.github-status-job:
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  services: []
  before_script: []

github-pending:
  extends: .github-status-job
  stage: .pre
  script:
    - sh test/docker_test/ci-github-status.sh pending

pipeline-passed:
  extends: .github-status-job
  stage: .post
  when: on_success
  needs:
    - job: github-pending
      artifacts: false
    - job: tree-already-tested
      optional: true
      artifacts: false
    - job: test-ubuntu
      artifacts: false
    - job: test-alpine
      artifacts: false
  script:
    - sh test/docker_test/ci-github-status.sh passed
  artifacts:
    when: always
    paths: [ci-pipeline-passed]
    expire_in: 7 days

github-status:
  extends: .github-status-job
  stage: .post
  when: always
  needs:
    - job: pipeline-passed
      artifacts: true
  script:
    - sh test/docker_test/ci-github-status.sh final
